<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10151c" />
    <meta name="description" content="CUIT Hub" />
    <title>CUIT Hub</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10151c; color: #e8edf2; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 2.5rem 0; }
      .mark { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border: 1px solid #526170; border-radius: 8px; color: #c7f04a; font-weight: 800; }
      h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: 0; }
      p { margin: 0; color: #a6b1bd; line-height: 1.7; }
      .status { margin-top: 2rem; display: flex; align-items: center; gap: .6rem; font-size: .9rem; color: #c7f04a; }
      .dot { width: .55rem; height: .55rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 .3rem #c7f04a22; }
      @media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.8s ease-in-out infinite; } }
      @keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <span class="mark" aria-hidden="true">CH</span>
      <h1>Opening CUIT Hub</h1>
      <p>Connecting to CUIT Hub. If this takes too long, check your network connection and reopen the app.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span><span>Connecting</span></div>
    </main>
  </body>
</html>
