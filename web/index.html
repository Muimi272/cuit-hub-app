<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="CUIT Hub" />
    <title>CUIT Hub</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: #0b1220;
        color: #e7edf7;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #0b1220; }
      main { display: grid; justify-items: center; width: min(25rem, calc(100% - 3rem)); text-align: center; }
      .brand { position: relative; display: grid; place-items: center; width: 7rem; height: 7rem; }
      .brand::before, .brand::after { content: ""; position: absolute; border-radius: 50%; }
      .brand::before { inset: 0; border: 1px solid #78aaff42; animation: breathe 1.8s ease-in-out infinite; }
      .brand::after { inset: .55rem; border: 2px solid transparent; border-top-color: #78aaff; border-right-color: #78aaff55; animation: spin 1.05s linear infinite; }
      .brand img { width: 4.35rem; height: 4.35rem; object-fit: contain; filter: drop-shadow(0 8px 18px #0007); animation: mark-in .65s cubic-bezier(.2, .8, .2, 1) both; }
      h1 { margin: 1.4rem 0 .45rem; font-size: 1.55rem; font-weight: 650; letter-spacing: 0; animation: rise .55s .1s ease-out both; }
      .message { min-height: 1.5rem; margin: 0; color: #98a8bf; font-size: .88rem; line-height: 1.5; animation: rise .55s .18s ease-out both; }
      .progress { width: 10rem; height: 2px; margin-top: 1.75rem; overflow: hidden; background: #25344a; animation: rise .55s .25s ease-out both; }
      .progress span { display: block; width: 100%; height: 100%; background: #78aaff; transform-origin: left; animation: progress 1.35s cubic-bezier(.4, 0, .2, 1) both; }
      .retry { display: none; min-height: 2.5rem; margin-top: 1.5rem; padding: 0 1.2rem; border: 1px solid #78aaff; border-radius: 6px; background: transparent; color: #dceaff; cursor: pointer; font: 600 .85rem/1 system-ui, sans-serif; }
      .retry:hover { background: #78aaff18; }
      .retry:focus-visible { outline: 2px solid #dceaff; outline-offset: 3px; }
      [data-state="error"] .brand::after, [data-state="error"] .progress { display: none; }
      [data-state="error"] .brand::before { border-color: #ff8f8f66; animation: none; }
      [data-state="error"] .retry { display: inline-flex; align-items: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { opacity: .45; transform: scale(.93); } }
      @keyframes mark-in { from { opacity: 0; transform: scale(.72); } }
      @keyframes rise { from { opacity: 0; transform: translateY(.45rem); } }
      @keyframes progress { 0% { transform: scaleX(.06); } 65% { transform: scaleX(.72); } 100% { transform: scaleX(.94); } }
      @media (prefers-reduced-motion: reduce) {
        .brand::before, .brand::after, .brand img, h1, .message, .progress, .progress span { animation: none; }
      }
    </style>
  </head>
  <body>
    <main id="splash" data-state="loading" aria-live="polite">
      <div class="brand" aria-hidden="true"><img src="/icon.png" alt="" /></div>
      <h1>CUIT Hub</h1>
      <p id="message" class="message">Connecting to the community</p>
      <div class="progress" aria-hidden="true"><span></span></div>
      <button id="retry" class="retry" type="button">Try again</button>
    </main>
    <script>
      const HUB_URL = "https://hub.cuit.dev";
      const MINIMUM_SPLASH_MS = matchMedia("(prefers-reduced-motion: reduce)").matches ? 250 : 1100;
      const splash = document.getElementById("splash");
      const message = document.getElementById("message");
      const retry = document.getElementById("retry");

      async function connect() {
        const startedAt = performance.now();
        splash.dataset.state = "loading";
        message.textContent = "Connecting to the community";
        retry.disabled = true;

        try {
          await fetch(HUB_URL, { mode: "no-cors", cache: "no-store" });
          const remaining = Math.max(0, MINIMUM_SPLASH_MS - (performance.now() - startedAt));
          await new Promise((resolve) => setTimeout(resolve, remaining));
          location.replace(HUB_URL);
        } catch {
          splash.dataset.state = "error";
          message.textContent = "Unable to connect to CUIT Hub";
          retry.disabled = false;
        }
      }

      retry.addEventListener("click", connect);
      connect();
    </script>
  </body>
</html>
