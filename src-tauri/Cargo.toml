[package]
name = "cuit-hub-app"
version = "1.0.0"
description = "CUIT Hub installable WebView application"
authors = ["CUIT Hub"]
edition = "2021"

[lib]
name = "cuit_hub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fcm = "0.2"
